name: Push to Nix Flake Registry

on:
  workflow_call:
    inputs:
      pkgname:
        description: 'Package name'
        required: true
        type: string
      nixpkgs-repo:
        description: 'Target nixpkgs repo (e.g. pawprnt/nixpkgs)'
        required: true
        type: string
      nix-path:
        description: 'Path to nix expression in calling repo'
        required: false
        type: string
        default: 'nix/default.nix'
      version:
        description: 'Package version (used in commit message)'
        required: false
        type: string
        default: ''
    secrets:
      NIX_GITHUB_TOKEN:
        description: 'GitHub PAT with repo access to nixpkgs repo'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify nix syntax
        run: nix-instantiate --parse ${{ inputs.nix-path }} > /dev/null

      - name: Compute source hash
        id: hash
        run: |
          # extract owner, repo, rev from fetchFromGitHub in the nix expression
          OWNER=$(grep -oP 'owner\s*=\s*"\K[^"]+' ${{ inputs.nix-path }} | head -1)
          REPO=$(grep -oP 'repo\s*=\s*"\K[^"]+' ${{ inputs.nix-path }} | head -1)
          REV=$(grep -oP 'rev\s*=\s*"\K[^"]+' ${{ inputs.nix-path }} | head -1)

          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "rev=$REV" >> $GITHUB_OUTPUT

          echo "Computing hash for $OWNER/$REPO@$REV..."

          # prefetch the tarball
          RAW_HASH=$(nix-prefetch-url --unpack --type sha256 \
            "https://github.com/$OWNER/$REPO/archive/$REV.tar.gz" 2>/dev/null)

          # convert to SRI format
          SRI_HASH=$(nix hash to-sri --type sha256 "$RAW_HASH")

          echo "hash=$SRI_HASH" >> $GITHUB_OUTPUT
          echo "Computed hash: $SRI_HASH"

      - name: Update hash in nix expression
        run: |
          # replace the placeholder hash with the computed one (only standalone hash, not cargoHash)
          sed -i '/cargoHash/!s|hash = "sha256-[^"]*"|hash = "${{ steps.hash.outputs.hash }}"|' \
            ${{ inputs.nix-path }}
          echo "Updated hash in ${{ inputs.nix-path }}"

      - name: Checkout nixpkgs repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.nixpkgs-repo }}
          ref: main
          token: ${{ secrets.NIX_GITHUB_TOKEN }}
          path: nixpkgs-repo

      - name: Copy package expression
        run: |
          mkdir -p nixpkgs-repo/pkgs/${{ inputs.pkgname }}
          cp ${{ inputs.nix-path }} nixpkgs-repo/pkgs/${{ inputs.pkgname }}/default.nix

      - name: Commit and push
        run: |
          cd nixpkgs-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          VERSION="${{ inputs.version || github.ref_name }}"
          git commit -m "${{ inputs.pkgname }}: update to $VERSION"
          git push
