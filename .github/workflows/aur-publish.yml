name: Push to AUR

on:
  workflow_call:
    inputs:
      pkgname:
        description: 'Package name'
        required: true
        type: string
    secrets:
      AUR_DEPLOY_KEY:
        description: 'SSH private key for AUR'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/aur_key -o StrictHostKeyChecking=no"
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm openssh git sed pacman-contrib

      - name: Setup SSH
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.AUR_DEPLOY_KEY }}" > /root/.ssh/aur_key
          chmod 600 /root/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts

      - uses: actions/checkout@v4

      - name: Push to AUR
        run: |
          cd packaging/aur

          git init
          git remote add aur aur@aur.archlinux.org:${{ inputs.pkgname }}.git
          git fetch aur master
          git checkout aur/master

          # get version from tag
          VERSION="${GITHUB_REF_NAME#v}"

          # update version
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD

          # update sha256sums
          updpkgsums

          # update .SRCINFO
          makepkg --printsrcinfo > .SRCINFO

          # commit and push
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && exit 0
          git commit -m "${VERSION}"
          git push aur master
