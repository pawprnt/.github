name: Push to AUR

on:
  workflow_call:
    inputs:
      pkgname:
        description: 'Package name'
        required: true
        type: string
    secrets:
      AUR_DEPLOY_KEY:
        description: 'SSH private key for AUR'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GIT_SSH_COMMAND: "ssh -i /home/builder/.ssh/aur_key -o StrictHostKeyChecking=no"
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm openssh git sed pacman-contrib sudo

      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Setup SSH
        run: |
          mkdir -p /home/builder/.ssh
          echo "${{ secrets.AUR_DEPLOY_KEY }}" > /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          chown -R builder:builder /home/builder/.ssh

      - uses: actions/checkout@v4

      - name: Push to AUR
        run: |
          cd packaging/aur

          # clean local files that conflict with AUR branch
          rm -f .SRCINFO .gitignore PKGBUILD forager.desktop readme.txt

          git init
          git remote add aur aur@aur.archlinux.org:${{ inputs.pkgname }}.git
          git fetch aur master
          git checkout aur/master

          # fix permissions for builder user
          chown -R builder:builder /__w/forager/forager/packaging/aur
          sudo -u builder git config --global --add safe.directory /__w/forager/forager/packaging/aur

          # get version from tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: must be triggered from a tag push (v*)"
            exit 1
          fi

          # update version
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD

          # update sha256sums (must run as non-root)
          sudo -u builder updpkgsums

          # update .SRCINFO
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          # commit and push
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && exit 0
          git commit -m "${VERSION}"
          git push aur master
